name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # `npm test` rebuilds public/. Vercel serves the *committed* copy from its
      # CDN, so a stale one ships silently - correct locally, wrong in production.
      - name: Committed assets match a fresh build
        run: git diff --exit-code --stat public/ || {
          echo "::error::public/ is out of date. Run 'npm run build:assets' and commit the result.";
          exit 1; }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-gov-frontend-express:ci .
